name: Release Windows and Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test:frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: vareliox-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            gir1.2-webkit2-4.1 python3-gi xvfb xauth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test:frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles deb,appimage
      - name: Linux WebKitGTK UI regression checks
        run: bash scripts/test-visual-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vareliox-linux-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: vareliox-*-${{ github.ref_name }}
          path: ${{ runner.temp }}/vareliox-release-downloads
          merge-multiple: true
      - name: Prepare release files and checksums
        run: |
          mkdir release
          find "$RUNNER_TEMP/vareliox-release-downloads" -type f \
            \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} release/ \;
          version="${GITHUB_REF_NAME#v}"
          test -f "release/Vareliox_${version}_x64-setup.exe"
          test -f "release/Vareliox_${version}_amd64.deb"
          test -f "release/Vareliox_${version}_amd64.AppImage"
          test "$(find release -type f | wc -l)" -eq 3
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vareliox $GITHUB_REF_NAME" \
              --notes-file "$notes" --latest
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vareliox $GITHUB_REF_NAME" \
              --generate-notes --latest
          fi
